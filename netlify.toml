# Sitio estático: no hay build, solo se completa la URL pública del sitio.
[build]
  publish = "."
  # Netlify define URL con la dirección principal del sitio (o el dominio propio si lo agregás).
  # Las vistas previas de WhatsApp, Instagram, etc. necesitan URLs absolutas.
  command = "sed -i \"s|__SITE_URL__|${URL}|g\" index.html robots.txt sitemap.xml"

[build.environment]
  # No hace falta instalar las herramientas de desarrollo para publicar.
  NPM_FLAGS = "--omit=dev"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------
# Escaneos de bots
# Bots automáticos prueban rutas de WordPress, PHP y archivos de configuración
# que este sitio no tiene. En vez de servirles la página 404 completa, les
# devolvemos un 404 de una línea (blocked.txt): menos ancho de banda y nada de
# HTML ni scripts de analytics. Para sumar rutas, copiá un bloque.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/wp-admin/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.aws/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/vendor/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/cgi-bin/*"
  to = "/blocked.txt"
  status = 404
  force = true
